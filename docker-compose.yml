services:
  db:
    image: postgres:16-alpine
    container_name: mte-fs-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mte}
      POSTGRES_DB: ${POSTGRES_DB:-mte}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d
    ports:
      - "5446:5432"
  api:
    build: ./apps/api
    container_name: mte-fs-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mte:mte@db:5432/mte}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8802:8000"
    depends_on:
      - db
  web:
    build: ./apps/web
    container_name: mte-fs-web
    restart: unless-stopped
    ports:
      - "8803:80"
    depends_on:
      - api
volumes:
  pgdata:
  uploads:
